[package]
name = "atsunuri"
version = "0.1.0"
edition = "2024"
description = "A painting app for Linux with pressure-sensitive tablet support."

[dependencies]
atsunuri-core = { path = "../atsunuri-core" }
env_logger = "0.11.11"
log = "0.4.34"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
sctk-adwaita = "0.12.0"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["system"] }
# dlopen: load libwayland-client at runtime so building needs no Wayland dev packages.
wayland-backend = { version = "0.3.17", features = ["client_system", "dlopen"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }
wgpu = "30.0.1"
